name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # WordPilot 依赖 Windows + pywin32（COM），CI 只跑离线单测（不需要 Word）
    runs-on: windows-latest
    # 统一 UTF-8：runner 的 stdout 默认是 cp1252，打印中文会抛 UnicodeEncodeError（2026-10-28 实测）
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Environment info
        run: |
          python --version
          python -c "import sys, platform; print(sys.executable); print(platform.platform())"
          git rev-parse HEAD
          python -m pip list --format=freeze | findstr /I "PySide6 pywin32 numpy cryptography pytest"

      - name: Run offline unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider -rf --tb=short

      - name: Quality gate (privacy + size + tests)
        shell: pwsh
        run: pwsh -NoProfile -File tools/quality-gate.ps1

      - name: Version metadata check
        run: python tools/version.py --check

      - name: Version matches tag (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (python tools/version.py).Trim()
          if ("v$version" -ne $tag) {
            Write-Error "tag $tag 与 src/__version__.py ($version) 不一致"
            exit 1
          }
          Write-Host "tag 与版本号一致：$tag"

      # 失败时把「失败用例清单 + 输出尾部」写进 Job Summary：
      # run 页面不用展开日志就能看到失败原因（此前排查 CI 靠猜）
      - name: Failure summary
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'pytest-fail.txt'
          python -m pytest -q -p no:cacheprovider -rf --tb=line --no-header *> $log
          $lines = @(Get-Content $log -Encoding utf8 -ErrorAction SilentlyContinue)
          '## CI 失败诊断' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '### 失败用例' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ($lines | Select-String -Pattern '^(FAILED|ERROR)' | ForEach-Object { $_.Line }) |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '### 输出尾部（最后 25 行）' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ($lines | Select-Object -Last 25) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
