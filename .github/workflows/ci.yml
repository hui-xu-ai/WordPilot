name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # WordPilot 依赖 Windows + pywin32（COM），CI 只跑离线单测（不需要 Word）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run offline unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider

      - name: Quality gate (privacy + size + tests)
        shell: pwsh
        run: pwsh -NoProfile -File tools/quality-gate.ps1
