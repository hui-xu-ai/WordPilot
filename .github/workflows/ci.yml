name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # WordPilot 依赖 Windows + pywin32（COM），CI 只跑离线单测（不需要 Word）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run offline unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider -rf --tb=short

      - name: Quality gate (privacy + size + tests)
        shell: pwsh
        run: pwsh -NoProfile -File tools/quality-gate.ps1

      - name: Version metadata check
        run: python tools/version.py --check

      - name: Version matches tag (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (python tools/version.py).Trim()
          if ("v$version" -ne $tag) {
            Write-Error "tag $tag 与 src/__version__.py ($version) 不一致"
            exit 1
          }
          Write-Host "tag 与版本号一致：$tag"

      # 失败时把「失败的用例清单」写进 Job Summary：
      # run 页面不用展开日志就能看到哪几条例挂（此前排查 CI 失败全靠猜）
      - name: Failure summary
        if: failure()
        shell: pwsh
        run: |
          "## CI 失败：离线单测" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          python -m pytest -q -p no:cacheprovider -rf --tb=line --no-header 2>&1 |
            Select-String -Pattern '^(FAILED|ERROR)' |
            ForEach-Object { $_.Line } |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
